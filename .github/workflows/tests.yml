name: Freqtrade Tests

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: '0 2 * * *'

jobs:
  test:
    name: "Test and Lint"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e ft_client/
        pip install -e .
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --tb=short --durations=10
    
    - name: Run Ruff linter
      run: |
        ruff check --output-format=github freqtrade tests
    
    - name: Run Ruff format check
      run: |
        ruff format --check freqtrade tests

  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-22.04
    needs: test
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e ft_client/
        pip install -e .
    
    - name: Create user directory
      run: |
        freqtrade create-userdir --userdir user_data
        cp tests/testdata/config.tests.json user_data/config.json
    
    - name: Run backtesting
      run: |
        freqtrade new-strategy -s TestStrategy
        freqtrade backtesting --datadir tests/testdata --strategy TestStrategy -i 5m
      continue-on-error: true

  status:
    name: "Test Status"
    runs-on: ubuntu-22.04
    needs: [test, integration-tests]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test.result }}" = "failure" ]; then
          echo "❌ Tests failed!"
          exit 1
        fi
        echo "✅ All tests passed!"
